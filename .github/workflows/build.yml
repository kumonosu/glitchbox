name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        id: build
        run: cmake --build build --config Release --parallel

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # GitHub's Windows machines have no display, so the editor tests run on Linux (under xvfb) instead.
          .\pluginval\pluginval.exe --strictness-level 10 --skip-gui-tests --timeout-ms 300000 --validate "build\Glitchbox_artefacts\Release\VST3\Glitchbox.vst3"
          Write-Host "pluginval exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Editor tests (informational)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          .\pluginval\pluginval.exe --strictness-level 5 --timeout-ms 300000 --output-dir pluginval-logs --validate "build\Glitchbox_artefacts\Release\VST3\Glitchbox.vst3"
          $code = $LASTEXITCODE
          Get-ChildItem pluginval-logs -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          Write-Host "pluginval exit code: $code"
          exit $code

      - name: Upload plugin
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Glitchbox-VST3-Windows
          path: build/Glitchbox_artefacts/Release/VST3/Glitchbox.vst3

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --timeout-ms 300000 --validate build/Glitchbox_artefacts/Release/VST3/Glitchbox.vst3
